name: Fundalert Cron

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alerts
        run: |
          curl -f https://fundalert-xi.vercel.app/api/cron/alerts \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
